<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chasse au trésor</title>
  <meta name="theme-color" content="#0b4f6c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chasse au trésor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest-joueur.webmanifest">
  <link rel="icon" href="icones/carte.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/joueur.css">
</head>
<body>
  <main class="ecran" id="accueil">
    <header class="titre">
      <svg class="boussole" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#f6e7c1" stroke="#f2b134" stroke-width="6"/>
        <path d="M50 12 L60 50 L50 88 L40 50 Z" fill="#3b2a1a"/>
        <path d="M50 12 L60 50 L40 50 Z" fill="#d1495b"/>
        <circle cx="50" cy="50" r="6" fill="#f2b134"/>
      </svg>
      <h1>Chasse au trésor</h1>
    </header>

    <section class="parchemin" id="message" aria-live="polite">
      <p class="parchemin-titre" id="message-titre">Ahoy, moussaillon !</p>
      <p id="message-texte">Scanne le QR code du capitaine pour découvrir où se cache le prochain trésor.</p>
    </section>

    <nav class="actions">
      <button class="gros-bouton bouton-scan" id="btn-scanner" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 16V8a2 2 0 0 1 2-2h8M32 6h8a2 2 0 0 1 2 2v8M42 32v8a2 2 0 0 1-2 2h-8M16 42H8a2 2 0 0 1-2-2v-8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><rect x="14" y="14" width="8" height="8" rx="1" fill="currentColor"/><rect x="26" y="14" width="8" height="8" rx="1" fill="currentColor"/><rect x="14" y="26" width="8" height="8" rx="1" fill="currentColor"/><rect x="28" y="28" width="4" height="4" fill="currentColor"/></svg>
        <span>Scanner un QR code</span>
      </button>
      <button class="gros-bouton bouton-carte" id="btn-destination" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 12l12-5 12 5 12-5v29l-12 5-12-5-12 5z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M29 20l6 6m0-6l-6 6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M12 32c3-4 6-2 9-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/></svg>
        <span>Rejoindre ma destination</span>
      </button>
      <label class="gros-bouton bouton-photo" for="champ-photo">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 16a4 4 0 0 1 4-4h5l3-5h12l3 5h5a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="24" cy="26" r="7" fill="none" stroke="currentColor" stroke-width="4"/></svg>
        <span>Prendre une photo</span>
      </label>
      <input id="champ-photo" type="file" accept="image/*" capture="environment" hidden>
    </nav>
  </main>

  <!-- Scanner de QR code -->
  <section class="plein-ecran scanner" id="scanner" hidden aria-label="Scanner un QR code">
    <video id="video" playsinline muted></video>
    <div class="viseur" aria-hidden="true"></div>
    <p class="scanner-aide" id="scanner-aide">Vise le QR code du capitaine</p>
    <button class="bouton-fermer" id="btn-fermer-scanner" type="button">Fermer</button>
  </section>

  <!-- Nouvelle destination -->
  <section class="plein-ecran annonce" id="annonce" hidden>
    <div class="annonce-contenu">
      <svg class="coffre" viewBox="0 0 120 100" aria-hidden="true">
        <path d="M10 45 Q10 10 60 10 Q110 10 110 45 Z" fill="#a0522d" stroke="#3b2a1a" stroke-width="5"/>
        <rect x="10" y="45" width="100" height="45" rx="4" fill="#8b4513" stroke="#3b2a1a" stroke-width="5"/>
        <rect x="52" y="38" width="16" height="22" rx="3" fill="#f2b134" stroke="#3b2a1a" stroke-width="4"/>
        <path d="M10 45h100" stroke="#f2b134" stroke-width="6"/>
      </svg>
      <p class="annonce-titre" id="annonce-titre">Nouvelle destination !</p>
      <p class="annonce-texte" id="annonce-texte">Le trésor t'attend. Trouve ton chemin sur la carte, avec un adulte.</p>
      <a class="gros-bouton bouton-carte" id="lien-maps" href="#" target="_blank" rel="noopener">
        <span>Rejoindre ma destination</span>
      </a>
      <button class="bouton-texte" id="btn-fermer-annonce" type="button">Plus tard</button>
    </div>
  </section>

  <!-- Photo souvenir -->
  <section class="plein-ecran photo" id="photo" hidden>
    <p class="annonce-titre">Montre ta photo au capitaine !</p>
    <img id="photo-image" alt="Ta photo souvenir">
    <div class="photo-boutons">
      <label class="gros-bouton bouton-photo" for="champ-photo"><span>Reprendre</span></label>
      <button class="gros-bouton bouton-retour" id="btn-fermer-photo" type="button"><span>Fermer</span></button>
    </div>
  </section>

  <script src="js/vendor/jsQR.js"></script>
  <script src="js/joueur.js"></script>
</body>
</html>
