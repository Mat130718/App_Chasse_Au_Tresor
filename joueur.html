<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chasse au trésor</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: #0e4a5c; color: #fff8e7; font: 18px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    main { max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 1.8rem; }
    p { margin: 0; }
    .coords { font-variant-numeric: tabular-nums; opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>Chasse au trésor</h1>
    <p>Le mode joueur arrive bientôt (bloc 3).</p>
    <p class="coords" id="coords"></p>
  </main>
  <script>
    // Aperçu provisoire : affiche la position lue dans le QR code.
    const params = new URLSearchParams(location.search);
    const lat = params.get('lat'), lng = params.get('lng');
    if (lat && lng) document.getElementById('coords').textContent = 'QR code lu : ' + lat + ', ' + lng;
  </script>
</body>
</html>
